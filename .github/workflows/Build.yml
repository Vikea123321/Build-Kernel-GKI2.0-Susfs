name: GKI 2.0 Kernel Builder with KernelSU & SUSFS

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel branch (e.g., common-android14-5.15-2025-0)'
        required: true
        type: string
        default: 'common-android14-5.15-2025-05'
      
      kernelsu_variant:
        description: 'KernelSU variant to integrate'
        required: true
        type: choice
        default: 'official'
        options:
          - 'none'
          - 'official'
          - 'next'
      
      enable_susfs:
        description: 'Enable SUSFS integration (requires KernelSU)'
        required: true
        type: boolean
        default: false
      
      susfs_branch:
        description: 'SUSFS branch (e.g., gki-android13-5.15)'
        required: false
        type: string
        default: 'gki-android13-5.15'
      
      stock_boot_url:
        description: 'Stock boot.img URL (optional)'
        required: false
        type: string
      
      lto_mode:
        description: 'LTO mode'
        required: true
        type: choice
        default: 'thin'
        options:
          - 'thin'
          - 'full'
          - 'none'

env:
  DEBIAN_FRONTEND: noninteractive
  WORKSPACE: ${{ github.workspace }}
  
jobs:
  build-gki-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v5
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            repo python3-pip bc cpio kmod libssl-dev rsync

      - name: Setup Git Configuration
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Validate Kernel Branch Format
        id: validate_branch
        run: |
          BRANCH="${{ github.event.inputs.kernel_branch }}"
          echo "Processing branch: $BRANCH"
          
          # Extract version info from branch name
          if [[ $BRANCH =~ android([0-9]+)-([0-9]+\.[0-9]+) ]]; then
            ANDROID_VERSION=${BASH_REMATCH[1]}
            KERNEL_VERSION=${BASH_REMATCH[2]}
            echo "android_version=$ANDROID_VERSION" >> $GITHUB_OUTPUT
            echo "kernel_version=$KERNEL_VERSION" >> $GITHUB_OUTPUT
            
            # Determine build system
            case "$ANDROID_VERSION-$KERNEL_VERSION" in
              "12-5.10")
                echo "build_system=legacy" >> $GITHUB_OUTPUT
                echo "use_bazel=false" >> $GITHUB_OUTPUT
                ;;
              "13-5.10"|"13-5.15")
                echo "build_system=both" >> $GITHUB_OUTPUT
                echo "use_bazel=true" >> $GITHUB_OUTPUT
                ;;
              "14-5.15"|"14-6.1"|"15-6.6")
                echo "build_system=bazel" >> $GITHUB_OUTPUT
                echo "use_bazel=true" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "build_system=bazel" >> $GITHUB_OUTPUT
                echo "use_bazel=true" >> $GITHUB_OUTPUT
                ;;
            esac
          else
            echo "Invalid branch format" >&2
            exit 1
          fi

      - name: Download Kernel Source
        run: |
          mkdir -p android-kernel
          cd android-kernel
          
          echo "Initializing repo with branch: ${{ github.event.inputs.kernel_branch }}"
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest \
            -b ${{ github.event.inputs.kernel_branch }}
          
          # Handle deprecated branches
          if ! repo --trace sync -c -j$(nproc) --no-tags --fail-fast 2>/dev/null; then
            echo "Branch might be deprecated, trying alternative approach..."
            FORMATTED_BRANCH=${{ github.event.inputs.kernel_branch }}
            FORMATTED_BRANCH=${FORMATTED_BRANCH#common-}
            
            REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common${FORMATTED_BRANCH})
            if [[ $REMOTE_BRANCH == *"deprecated"* ]]; then
              echo "Found deprecated branch: $FORMATTED_BRANCH"
              sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" .repo/manifests/default.xml
            fi
            
            repo --trace sync -c -j$(nproc) --no-tags --fail-fast
          fi

      - name: Integrate KernelSU
        if: ${{ github.event.inputs.kernelsu_variant != 'none' }}
        working-directory: android-kernel
        run: |
          case "${{ github.event.inputs.kernelsu_variant }}" in
            "official")
              echo "Integrating KernelSU (Official)..."
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s
              KERNELSU_DIR="KernelSU"
              ;;
            "next")
              echo "Integrating KernelSU-Next..."
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s
              # KernelSU-Next might use different directory structure
              if [ -d "KernelSU" ]; then
                KERNELSU_DIR="KernelSU"
              elif [ -d "KernelSU-Next" ]; then
                KERNELSU_DIR="KernelSU-Next"
              else
                echo "❌ KernelSU-Next directory structure detection failed"
                exit 1
              fi
              ;;
            *)
              echo "❌ Invalid KernelSU variant: ${{ github.event.inputs.kernelsu_variant }}"
              exit 1
              ;;
          esac
          
          # Verify integration
          if [ -d "$KERNELSU_DIR" ]; then
            echo "✅ KernelSU (${{ github.event.inputs.kernelsu_variant }}) integrated successfully"
            echo "Directory structure:"
            ls -la "$KERNELSU_DIR/"
            
            # Store KernelSU directory for later steps
            echo "KERNELSU_DIR=$KERNELSU_DIR" >> $GITHUB_ENV
            
            # Display version info if available
            if [ -f "$KERNELSU_DIR/VERSION" ]; then
              echo "KernelSU Version: $(cat$KERNELSU_DIR/VERSION)"
            fi
          else
            echo "❌ KernelSU integration failed"
            exit 1
          fi

      - name: Integrate SUSFS
        if: ${{ github.event.inputs.enable_susfs == 'true' && github.event.inputs.kernelsu_variant != 'none' }}
        run: |
          echo "Integrating SUSFS with branch: ${{ github.event.inputs.susfs_branch }}"
          echo "Target KernelSU variant: ${{ github.event.inputs.kernelsu_variant }}"
          
          # Clone SUSFS repository
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b ${{ github.event.inputs.susfs_branch }}
          
          # Apply SUSFS patches
          cd android-kernel
          
          # Use dynamic KernelSU directory from previous step
          KERNELSU_TARGET_DIR="${KERNELSU_DIR:-KernelSU}"
          echo "Using KernelSU directory: $KERNELSU_TARGET_DIR"
          
          # Copy KernelSU patch
          if [ -f "../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" ]; then
            cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch "$KERNELSU_TARGET_DIR/"
            echo "✅ SUSFS KernelSU patch copied"
          else
            echo "⚠️ SUSFS KernelSU patch not found, checking alternative locations..."
            find ../susfs4ksu -name "*susfs*ksu*.patch" -type f | head -1 | xargs -I {} cp {} "$KERNELSU_TARGET_DIR/"
          fi
          
          # Copy kernel patches
          KERNEL_PATCH=$(find ../susfs4ksu/kernel_patches/ -name "50_add_susfs_in_kernel-${{ github.event.inputs.susfs_branch }}.patch" | head -1)
          if [ -n "$KERNEL_PATCH" ]; then
            cp "$KERNEL_PATCH" common/
            echo "✅ Specific SUSFS kernel patch found and copied"
          else
            echo "⚠️ Specific SUSFS kernel patch not found, using generic patch"
            find ../susfs4ksu/kernel_patches/ -name "50_add_susfs_in_kernel*.patch" | head -1 | xargs -I {} cp {} common/
          fi
          
          # Copy filesystem patches with error handling
          if [ -d "../susfs4ksu/kernel_patches/fs/" ]; then
            cp -r ../susfs4ksu/kernel_patches/fs/* common/fs/ 2>/dev/null || echo "⚠️ Some FS patches may not be applicable"
          fi
          
          if [ -d "../susfs4ksu/kernel_patches/include/linux/" ]; then
            cp ../susfs4ksu/kernel_patches/include/linux/* common/include/linux/ 2>/dev/null || echo "⚠️ Some include patches may not be applicable"
          fi
          
          # Apply patches with enhanced error handling
          cd "$KERNELSU_TARGET_DIR"
          SUSFS_KSU_PATCH=$(ls *susfs*ksu*.patch 2>/dev/null | head -1)
          if [ -n "$SUSFS_KSU_PATCH" ]; then
            if patch -p1 --dry-run < "$SUSFS_KSU_PATCH" >/dev/null 2>&1; then
              patch -p1 < "$SUSFS_KSU_PATCH"
              echo "✅ KernelSU SUSFS patch applied successfully"
            else
              echo "⚠️ KernelSU SUSFS patch failed, attempting with alternative strategies..."
              # Try with different patch levels
              for level in 0 2 3; do
                if patch -p$level --dry-run < "$SUSFS_KSU_PATCH" >/dev/null 2>&1; then
                  patch -p$level < "$SUSFS_KSU_PATCH"
                  echo "✅ KernelSU SUSFS patch applied with -p$level"
                  break
                fi
              done
            fi
          else
            echo "⚠️ No KernelSU SUSFS patch found for application"
          fi
          
          cd ../common
          SUSFS_PATCH=$(ls 50_add_susfs_in_kernel*.patch 2>/dev/null | head -1)
          if [ -n "$SUSFS_PATCH" ]; then
            if patch -p1 --dry-run < "$SUSFS_PATCH" >/dev/null 2>&1; then
              patch -p1 < "$SUSFS_PATCH"
              echo "✅ SUSFS kernel patch applied successfully"
            else
              echo "⚠️ SUSFS kernel patch failed, attempting with alternative strategies..."
              # Try with different patch levels
              for level in 0 2 3; do
                if patch -p$level --dry-run < "$SUSFS_PATCH" >/dev/null 2>&1; then
                  patch -p$level < "$SUSFS_PATCH"
                  echo "✅ SUSFS kernel patch applied with -p$level"
                  break
                fi
              done
            fi
          else
            echo "⚠️ No SUSFS kernel patch found for application"
          fi
          
          # Verify SUSFS integration
          echo "SUSFS integration verification:"
          find . -name "*susfs*" -type f | head -10

      - name: Build Kernel with Legacy build.sh
        if: ${{ steps.validate_branch.outputs.build_system == 'legacy' || steps.validate_branch.outputs.use_bazel == 'false' }}
        working-directory: android-kernel
        run: |
          echo "Building kernel using legacy build.sh method..."
          LTO=${{ github.event.inputs.lto_mode }} BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh
          
          # Verify build artifacts
          if [ -f "out/*/dist/Image" ]; then
            echo "✅ Kernel build completed successfully"
            ls -la out/*/dist/
          else
            echo "❌ Kernel build failed"
            exit 1
          fi

      - name: Build Kernel with Bazel
        if: ${{ steps.validate_branch.outputs.use_bazel == 'true' }}
        working-directory: android-kernel
        run: |
