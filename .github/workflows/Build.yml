name: GKI 2.0 Kernel Builder with KernelSU & SUSFS

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: 'Kernel Source URL'
        required: true
        default: 'https://github.com/android-kernel-sources/kernel_manifest'
      kernel_branch:
        description: 'Kernel Branch'
        required: true
        default: 'common-android12-5.10'
      kernel_aosp_branch:
        description: 'Android Kernel AOSP Tag / Branch'
        required: false
        default: 'android12-5.10-2024-05'
      ksu_version:
        description: 'KernelSU Version/Tag'
        required: false
        default: 'v1.0.1'
      susfs_version:
        description: 'SUSFS Version/Branch'
        required: false
        default: 'v1.5.5'
      use_bazel:
        description: 'Use Bazel Build System (Auto-detected if blank)'
        required: false
        type: choice
        options:
          - 'auto'
          - 'true'
          - 'false'
        default: 'auto'
      lto_mode:
        description: 'LTO Optimization Mode'
        required: false
        type: choice
        options:
          - 'thin'
          - 'full'
          - 'none'
        default: 'thin'

jobs:
  build-gki-kernel:
    runs-on: ubuntu-latest

    steps:
     - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ccache automake flex bison libssl-dev libelf-dev \
            bc libncurses5-dev libncursesw5-dev libglib2.0-dev \
            zip unzip tar curl wget python3 python3-pip rsync \
            device-tree-compiler build-essential

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Repo and Sync
        run: |
          mkdir android-kernel && cd android-kernel
          repo init -u ${{ github.event.inputs.kernel_source }} -b ${{ github.event.inputs.kernel_branch }} --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Validate Build System Branch
        id: validate_branch
        run: |
          cd android-kernel
          USE_BAZEL="${{ github.event.inputs.use_bazel }}"
          
          if [ "$USE_BAZEL" = "auto" ]; then
            if [ -f "build/build_with_bazel.py" ] || [ -f "tools/bazel" ]; then
              echo "use_bazel=true" >> $GITHUB_OUTPUT
              echo "build_system=bazel" >> $GITHUB_OUTPUT
            else
              echo "use_bazel=false" >> $GITHUB_OUTPUT
              echo "build_system=legacy" >> $GITHUB_OUTPUT
            fi
          else
            echo "use_bazel=$USE_BAZEL" >> $GITHUB_OUTPUT
            if [ "$USE_BAZEL" = "true" ]; then
              echo "build_system=bazel" >> $GITHUB_OUTPUT
            else
              echo "build_system=legacy" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Integrate KernelSU
        run: |
          cd android-kernel/common
          echo "Integrating KernelSU (${{ github.event.inputs.ksu_version }})..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s ${{ github.event.inputs.ksu_version }}

      - name: Integrate SUSFS Patches
        run: |
          cd android-kernel
          echo "Setting up SUSFS patches..."
          
          # Clone SUSFS repository if available
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b ${{ github.event.inputs.susfs_version }} susfs_src || true
          
          if [ -d "susfs_src" ]; then
            echo "Applying SUSFS kernel patches..."
            # Look for 5.10 patches
            PATCH_FILE=$(find susfs_src -name "*5.10*.patch" | head -n 1)
            if [ -n "$PATCH_FILE" ]; then
              cd common
              patch -p1 < "../$PATCH_FILE" || echo "Patch applied with warnings/offsets"
              cd ..
            fi
          else
            echo "SUSFS repository cloning skipped or failed."
          fi

      - name: Verify SUSFS Integration
        run: |
          cd android-kernel
          echo "SUSFS integration verification:"
          find . -name "*susfs*" -type f | head -10

      - name: Build Kernel with Legacy build.sh
        if: ${{ steps.validate_branch.outputs.build_system == 'legacy' || steps.validate_branch.outputs.use_bazel == 'false' }}
        working-directory: android-kernel
        run: |
          echo "Building kernel using legacy build.sh method..."
          LTO=${{ github.event.inputs.lto_mode }} BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

          # Verify build artifacts
          if [ -f "out/*/dist/Image" ]; then
            echo "Kernel build completed successfully"
            ls -la out/*/dist/
          else
            echo "Kernel build failed"
            exit 1
          fi

      - name: Build Kernel with Bazel
        if: ${{ steps.validate_branch.outputs.use_bazel == 'true' }}
        working-directory: android-kernel
        run: |
          echo "Building kernel using Bazel method..."
          tools/bazel run //common:kernel_aarch64_dist

          if [ -f "out/kernel_aarch64/dist/Image" ]; then
            echo "Bazel build completed successfully"
            ls -la out/kernel_aarch64/dist/
          else
            echo "Bazel build failed"
            exit 1
          fi

      - name: Prepare Artifacts
        run: |
          mkdir -p artifact_out
          find android-kernel/out -name "Image*" -exec cp {} artifact_out/ \;
          find android-kernel/out -name "boot.img" -exec cp {} artifact_out/ \; || true
          find android-kernel/out -name "*.ko" -exec cp {} artifact_out/ \; || true
          cd artifact_out && tar -czvf ../kernel_dist.tar.gz .

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GKI-Kernel-${{ github.event.inputs.kernel_branch }}
          path: kernel_dist.tar.gz
